<header class="topbar">
  <button class="icon-button mobile-menu" aria-label="Menüyü aç" (click)="app.menuOpen.update(value => !value)">
    <fa-icon [icon]="app.faBars" />
  </button>
  <div class="breadcrumbs"><span>Footra</span><span class="crumb-separator">/</span>{{ app.pageTitle() }}</div>
  <div class="topbar-right">
    <span class="demo-badge"><span></span> DEMO · GERÇEK PARA İŞLEMİ YAPMAZ</span>
    <button class="icon-button notification-button" aria-label="Bildirimler">
      <fa-icon [icon]="app.faBell" /><i></i>
    </button>
    <div class="top-avatar">AY</div>
  </div>
</header>
